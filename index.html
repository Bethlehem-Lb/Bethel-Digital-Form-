<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bethel Digital Form</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF & AutoTable for PDF exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf-autotable.min.js"></script>
</head>
<body>
  <div class="header" id="main-header">
    <h2>Bethel Digital Form</h2>
    <p style="font-size:12px; margin-top:4px; opacity:0.9;">Manage, fill, and track records</p>
    <button class="btn-create" onclick="showFormBuilder()">+ Create form</button>
  </div>

  <div class="container" id="main-content">
    <div class="card"><p style="text-align:center;">Loading forms...</p></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
